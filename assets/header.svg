<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0d" />
      <stop offset="60%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <linearGradient id="cyan-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="glow-emerald" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Space Mono', 'SF Mono', Monaco, Consolas, monospace; }
    .display { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .label { font-size: 11px; letter-spacing: 2px; fill: #8b93a4; }
    .accent { fill: #10b981; }
    .cyan { fill: #06b6d4; }
    .white { fill: #f3f4f8; }
    .dim { fill: #525a6c; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="300" rx="10" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
  <rect width="960" height="300" rx="10" fill="url(#grid)" />
  <rect width="960" height="300" fill="url(#glow-emerald)" />
  <rect width="960" height="300" fill="url(#glow-cyan)" />

  <!-- Top Metadata Bar -->
  <g transform="translate(40, 42)">
    <circle cx="0" cy="-3" r="3.5" fill="#10b981" />
    <text x="14" y="0" class="mono label">ENGINEERING DOSSIER // 2026</text>
    <text x="360" y="0" class="mono label">28.6139° N, 77.2090° E</text>
    <text x="700" y="0" class="mono label" text-anchor="end">PORTFOLIO-AYUSH-MISHRA.VERCEL.APP</text>
    <line x1="-5" y1="16" x2="880" y2="16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- Hero Typography -->
  <g transform="translate(40, 125)">
    <text x="0" y="0" class="display" font-size="44" letter-spacing="1.5" fill="#f3f4f8">AYUSH MISHRA</text>
    <text x="0" y="32" class="mono" font-size="13" letter-spacing="2.5" fill="url(#cyan-emerald)">
      AI ENGINEER · MULTI-AGENT SYSTEMS · LOW-LATENCY INFRASTRUCTURE
    </text>
    <text x="0" y="58" class="display" font-size="13" fill="#8b93a4" font-weight="400">
      Translating frontier LLM research into resilient, high-throughput production software.
    </text>
  </g>

  <!-- Bottom Telemetry Badges / Specs Grid -->
  <g transform="translate(40, 240)">
    <line x1="-5" y1="-22" x2="880" y2="-22" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Spec 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="mono" font-size="9" letter-spacing="1.5" fill="#525a6c">VOICE INFERENCE</text>
      <text x="0" y="19" class="mono" font-size="15" font-weight="700" fill="#10b981">&lt;700ms</text>
      <text x="75" y="19" class="mono" font-size="11" fill="#8b93a4">WebRTC + WASM</text>
    </g>

    <!-- Spec 2 -->
    <g transform="translate(240, 0)">
      <text x="0" y="0" class="mono" font-size="9" letter-spacing="1.5" fill="#525a6c">AGENT ORCHESTRATION</text>
      <text x="0" y="19" class="mono" font-size="15" font-weight="700" fill="#06b6d4">-70% LATENCY</text>
      <text x="130" y="19" class="mono" font-size="11" fill="#8b93a4">LangGraph + Redis</text>
    </g>

    <!-- Spec 3 -->
    <g transform="translate(530, 0)">
      <text x="0" y="0" class="mono" font-size="9" letter-spacing="1.5" fill="#525a6c">SPATIAL &amp; VECTORS</text>
      <text x="0" y="19" class="mono" font-size="15" font-weight="700" fill="#10b981">512-dim</text>
      <text x="72" y="19" class="mono" font-size="11" fill="#8b93a4">PostGIS Routing</text>
    </g>

    <!-- Spec 4 -->
    <g transform="translate(740, 0)">
      <text x="0" y="0" class="mono" font-size="9" letter-spacing="1.5" fill="#525a6c">ACADEMIC FOUNDATION</text>
      <text x="0" y="19" class="mono" font-size="14" font-weight="700" fill="#f3f4f8">B.Tech M&amp;C</text>
      <text x="96" y="19" class="mono" font-size="10" fill="#8b93a4">CUK '27</text>
    </g>
  </g>
</svg>

