<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0d" />
      <stop offset="60%" stop-color="#0d1017" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <linearGradient id="cyan-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="glow-emerald" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="85%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Space Mono', 'SF Mono', Consolas, 'Courier New', monospace; }
    .display { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .label { font-size: 11px; letter-spacing: 2px; fill: #8b93a4; }
  </style>

  <!-- Background -->
  <rect width="960" height="220" rx="8" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <rect width="960" height="220" rx="8" fill="url(#grid)" />
  <rect width="960" height="220" fill="url(#glow-emerald)" />
  <rect width="960" height="220" fill="url(#glow-cyan)" />

  <!-- Top bar -->
  <g transform="translate(36, 36)">
    <circle cx="0" cy="-3" r="3" fill="#10b981" />
    <text x="12" y="0" class="mono label">GITHUB PROFILE</text>
    <text x="888" y="0" class="mono label" text-anchor="end">PORTFOLIO-AYUSH-MISHRA.VERCEL.APP</text>
    <line x1="-5" y1="14" x2="888" y2="14" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- Title & Headline -->
  <g transform="translate(36, 105)">
    <text x="0" y="0" class="display" font-size="38" letter-spacing="1" fill="#f3f4f8">AYUSH MISHRA</text>
    <text x="0" y="28" class="mono" font-size="13" letter-spacing="2" fill="url(#cyan-emerald)">
      AI ENGINEER &amp; FULL-STACK DEVELOPER
    </text>
    <text x="0" y="52" class="display" font-size="13" fill="#8b93a4" font-weight="400">
      Building AI applications, scalable architectures, and open-source systems.
    </text>
  </g>

  <!-- Bottom Pills -->
  <g transform="translate(36, 188)">
    <text x="0" y="0" class="mono" font-size="10" letter-spacing="1.5" fill="#10b981">● AI/ML</text>
    <text x="80" y="0" class="mono" font-size="10" letter-spacing="1.5" fill="#8b93a4">·</text>
    <text x="96" y="0" class="mono" font-size="10" letter-spacing="1.5" fill="#06b6d4">● FULL-STACK</text>
    <text x="210" y="0" class="mono" font-size="10" letter-spacing="1.5" fill="#8b93a4">·</text>
    <text x="226" y="0" class="mono" font-size="10" letter-spacing="1.5" fill="#10b981">● OPEN SOURCE</text>
    <text x="346" y="0" class="mono" font-size="10" letter-spacing="1.5" fill="#8b93a4">·</text>
    <text x="362" y="0" class="mono" font-size="10" letter-spacing="1.5" fill="#06b6d4">● SYSTEM DESIGN</text>
  </g>
</svg>
