<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <linearGradient id="snake-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0d" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="snake-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <style>
      .mono-label {
        font-family: 'Space Mono', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
      }
      
      /* Snake Animation Track */
      @keyframes crawl-h1 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(280px); }
        100% { transform: translateX(0px); }
      }
      @keyframes crawl-h2 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-340px); }
        100% { transform: translateX(0px); }
      }
      @keyframes eat-glow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .snake-head {
        fill: #34d399;
        filter: drop-shadow(0 0 6px #10b981);
      }
      .snake-body {
        fill: url(#snake-gradient);
        filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.5));
      }
      .snake-group-1 {
        animation: crawl-h1 12s infinite ease-in-out;
      }
      .snake-group-2 {
        animation: crawl-h2 14s infinite ease-in-out;
      }
      .dot-glow {
        animation: eat-glow 3s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="180" rx="8" fill="url(#snake-bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

